[package]
name = "foldquery"
version = "0.1.0"
description = "Convert 3D models into papercraft templates"
authors = ["asener"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "foldquery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-openai = { version = "0.41", default-features = false, features = ["chat-completion", "chat-completion-types", "rustls"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
eventsource-stream = "0.2"
futures = "0.3"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1.24.0", features = ["v4"] }

